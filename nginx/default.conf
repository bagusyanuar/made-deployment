# ==========================================
# 1. API / Backend (api.madeprinting.com)
# ==========================================
server {
    listen 80;
    server_name api.madeprinting.com api-made.madeprinting.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.madeprinting.com api-made.madeprinting.com;

    ssl_certificate /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_app made-app;
        proxy_pass http://$upstream_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# 2. Frontend POS / Web App (pos.madeprinting.com)
# ==========================================
server {
    listen 80;
    server_name pos.madeprinting.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pos.madeprinting.com;

    ssl_certificate /etc/nginx/cert/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_frontend made-frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

